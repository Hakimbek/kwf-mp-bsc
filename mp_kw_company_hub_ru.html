body{background:var(--bg0);color:var(--text1);font-family:var(--ff-b);font-size:13px;line-height:1.6}

.grid-auto{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:12px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.sidebar-layout{display:flex;min-height:calc(100vh - 46px)}

function getKPIsForDept(id){
  const r=[];
  BSC.forEach(p=>p.kpis.forEach(k=>{
    const o=k.owners.includes(id),s=k.support.includes(id);
    if(o||s)r.push({...k,isOwner:o,perspColor:p.perspColor,perspBg:p.perspBg,perspective:p.perspective});
  }));
  return r;
}

function Badge({s}){
  return e("span",{style:{fontSize:10,fontWeight:600,padding:"3px 9px",borderRadius:99,
    background:SC[s]+"25",color:SC[s],border:`1px solid ${SC[s]}55`,whiteSpace:"nowrap",letterSpacing:"0.02em"
  }},SL[s]);
}

function DeptPill({id,small}){
  const d=DEPTS.find(x=>x.id===id);
  if(!d)return null;
  return e("span",{style:{fontSize:10,fontWeight:500,padding:"2px 7px",borderRadius:99,
    background:d.bg,color:d.color,border:`1px solid ${d.color}55`,whiteSpace:"nowrap"
  }},small?d.name.split(" ")[0]:d.name);
}

function Nav({tab,set}){
  const ts=[{id:"dept",l:"По отделам"},{id:"bsc",l:"BSC Overview"},{id:"learn",l:"Learning"},{id:"road",l:"Roadmap"}];
  return e("nav",{style:{display:"flex",alignItems:"center",gap:4,padding:"9px 14px",
    background:"#0e0e10",borderBottom:"1px solid #22222a",
    position:"sticky",top:0,zIndex:200,flexWrap:"wrap"}},
    e("span",{style:{fontFamily:"'Playfair Display',serif",fontSize:16,
      color:"#d4a84b",marginRight:10,whiteSpace:"nowrap",letterSpacing:"0.02em"}},"MP | KW"),
    ts.map(t=>e("button",{key:t.id,onClick:()=>set(t.id),style:{
      padding:"5px 12px",borderRadius:7,
      border:tab===t.id?"1px solid #d4a84b55":"1px solid transparent",
      background:tab===t.id?"#2a1a0022":"transparent",
      color:tab===t.id?"#d4a84b":"#7a789a",
      fontSize:12,fontWeight:500,transition:"all 0.2s"

  );
}

    e("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8,marginBottom:4}},
      e("div",{style:{fontFamily:"'Playfair Display',serif",fontSize:15,color:k.perspColor,lineHeight:1.3,fontWeight:600}},k.name),
      e(Badge,{s:k.status})
    ),
    e("div",{style:{fontSize:12,fontWeight:500,color:"#d0cee8",marginBottom:4}},k.ru),
    e("span",{style:{fontSize:10,padding:"2px 8px",borderRadius:99,display:"inline-block",marginBottom:12,

    e("div",{style:{background:dept.bg,borderRadius:8,padding:"10px 12px",marginBottom:12,
      border:`1px solid ${dept.color}44`}},
      e("div",{style:{fontSize:10,fontWeight:600,color:dept.color,marginBottom:4,letterSpacing:"0.05em"}},

      e("div",{style:{fontSize:12,color:"#c8c6e0",lineHeight:1.7}},k.deptRole[dept.id]||"—")
    ),

    [["Что измеряет?",k.what,"#6060a0"],["Почему важно?",k.why,"#6060a0"],["Как считается?",k.how,"#6060a0"],["Целевое значение",k.target,dept.color]].map(([label,text,lc])=>

}

function DeptView(){
  const [sel,setSel]=useState(null);
  const dept=sel?DEPTS.find(d=>d.id===sel):null;

  if(!sel){
    return e("div",{style:{padding:"16px",maxWidth:1100,margin:"0 auto"}},
      e("div",{style:{marginBottom:18}},
        e("div",{style:{fontFamily:"'Playfair Display',serif",fontSize:24,color:"#f0eff8",marginBottom:4}},"BSC по отделам"),
        e("div",{style:{fontSize:13,color:"#7a789a"}},"Выберите отдел — увидите все KPI и свою роль в каждом из них")
      ),
      e("div",{className:"dept-grid"},
        DEPTS.map(d=>{
          const kpis=getKPIsForDept(d.id);
          const owned=kpis.filter(k=>k.isOwner).length;
          const supp=kpis.filter(k=>!k.isOwner).length;
          return e("div",{key:d.id,onClick:()=>setSel(d.id),style:{
            background:"#16161a",borderRadius:12,border:`1px solid ${d.color}44`,
            padding:"15px 13px",cursor:"pointer",transition:"all 0.2s",
            boxShadow:`0 0 0 0px ${d.color}00`}},
            e("div",{style:{fontSize:22,marginBottom:8}},d.icon),
            e("div",{style:{fontFamily:"'Playfair Display',serif",fontSize:14,color:d.color,marginBottom:10,lineHeight:1.3,fontWeight:600}},d.name),
            e("div",{style:{display:"flex",gap:5,flexWrap:"wrap"}},
              owned>0&&e("span",{style:{fontSize:10,fontWeight:600,padding:"2px 8px",borderRadius:99,
                background:d.color+"22",color:d.color,border:`1px solid ${d.color}66`}},`${owned} KPI — владелец`),
              supp>0&&e("span",{style:{fontSize:10,padding:"2px 8px",borderRadius:99,
                background:d.bg,color:d.color,border:`1px solid ${d.color}33`}},`${supp} — участник`)
            )
          );
        })
      )
    );
  }

  const kpis=getKPIsForDept(sel);
  const owned=kpis.filter(k=>k.isOwner);
  const supp=kpis.filter(k=>!k.isOwner);

  return e("div",{style:{padding:"16px",maxWidth:1100,margin:"0 auto"}},
    e("div",{style:{display:"flex",alignItems:"center",gap:10,marginBottom:18,flexWrap:"wrap"}},
      e("button",{onClick:()=>setSel(null),style:{padding:"6px 13px",borderRadius:8,
        border:"1px solid #32323e",background:"#1e1e24",fontSize:12,color:"#b8b6d0"}},"← Все отделы"),
      e("span",{style:{fontSize:22}},dept.icon),
      e("div",null,
        e("div",{style:{fontFamily:"'Playfair Display',serif",fontSize:20,color:dept.color}},[dept.name]),
        e("div",{style:{fontSize:12,color:"#7a789a"}},`${owned.length} KPI в собственности · ${supp.length} KPI в поддержке`)
      )
    ),
    owned.length>0&&e("div",{style:{marginBottom:24}},
      e("div",{style:{fontSize:10,fontWeight:600,letterSpacing:"0.08em",color:dept.color,marginBottom:12,
        display:"flex",alignItems:"center",gap:8}},
        e("span",{style:{width:8,height:8,borderRadius:"50%",background:dept.color,display:"inline-block",boxShadow:`0 0 6px ${dept.color}`}}),
        "KPI В ПРЯМОЙ ОТВЕТСТВЕННОСТИ"
      ),
      e("div",{className:"grid-auto"},owned.map((k,i)=>e(KPICard,{key:i,k,dept,isOwner:true})))
    ),
    supp.length>0&&e("div",null,
      e("div",{style:{fontSize:10,fontWeight:600,letterSpacing:"0.08em",color:"#7a789a",marginBottom:12,
        display:"flex",alignItems:"center",gap:8}},
        e("span",{style:{width:8,height:2,background:"#7a789a",display:"inline-block"}}),
        "KPI В ПОДДЕРЖКЕ"
      ),
      e("div",{className:"grid-auto"},supp.map((k,i)=>e(KPICard,{key:i,k,dept,isOwner:false})))
    )
  );
}

const LEARN=[
  {id:"core",title:"Core Strategy",icon:"◈",color:"#d4a84b",modules:[
    {title:"QCD — внешнее обещание",body:`QCD — три столпа, через которые клиент оценивает поставщика.\n\nQuality: продукт соответствует стандарту каждый раз. GSM, BCT, влажность, белизна — лабораторный контроль каждой партии. Не «в целом нормально» — всегда в допуске.\n\nCost: цена реальная, покрывает себестоимость с маржой. Снижение cost — через LVP и правильный материал, не через демпинг.\n\nDelivery: OTIF ≥ 95%. Срыв поставки останавливает производство клиента. Продукт ничего не стоит без поставки.`},
    {title:"PIB — внутреннее обещание",body:`PIB — зеркало QCD, направленное внутрь. Без PIB нет команды, без команды нет LVP.\n\nPerformance: понятные задачи, исправное оборудование, чёткий план. Не «старайся больше» — а «вот SOP, вот инструмент, вот цель».\n\nIncome: справедливая и своевременная оплата. «Справедливая и своевременная оплата — основа доверия».\n\nBalance: предсказуемый график, уважение к личному времени. Люди, которые не выгорают — работают стабильно и долго.`},
    {title:"Value Selling — ценность, не продукт",body:`MP продаёт улучшение продукта клиента: вид, прочность, стоимость, скорость.\nKW продаёт формат-решение: прочная, доступная, быстрая, привлекательная, продающая.\n\n1 клиент = 1 главная боль. Сначала диагностика — потом предложение.\n\nValue-режимы KW:\n• Speed → «линия не остановится»\n• Economy → «снизили cost, не качество»\n• Engineering → «довезли без потерь»\n• SRP → «продали больше с полки»\n• White → «выглядишь дороже конкурента»\n\nПравило: 1 режим — 1 встреча. Не смешивать. Если проиграл по цене — измени игру.`},
    {title:"Стратегия «Ценность / Расстояние»",body:`Завод в Ургенче. Цена всегда включает доставку.\n\nЛокальный рынок (Хорезм): тотальное доминирование. Все продукты. Максимальный охват.\n\nУдалённые рынки (Ташкент, Долина, экспорт): только Синий океан.\n• Запрет: RSC и простой флютинг — логистика съедает маржу\n• MP фокус: CeLa, OqLayner (заменяем импорт)\n• KW фокус: die-cut, SnP, SRP\n\nФормула: Ценность продукта > Транспортные расходы.\nЧем сложнее продукт — тем шире его география.`}
  ]},
  {id:"lvp",title:"LVP Production",icon:"⬡",color:"#3dd6a3",modules:[
    {title:"Что такое LVP",body:`LVP (Low Variance Production) — система стабильно реализует максимальную расчётную способность каждый день.\n\nLVP — это НЕ: медленно, осторожно, «средне».\nLVP — это: одинаковый процесс → одинаковые параметры → одинаковый результат.\n\nVariation↓ = Control↑\nСтабильные 45 т/смену лучше хаотичных 55.\nПроцесс равен своему ХУДШЕМУ дню.\n\nУровни зрелости:\n1. Хаос → 2. Стабильно плохо → 3. Стабильно в норме → 4. Стабильно на максимуме\nLVP = движение к уровню 4.`},
    {title:"6 опор LVP",body:`1. Safety: безопасная среда + дисциплина поведения. Нет травм → нет аварийных остановок.\n\n2. Quality: всегда в допуске. Лаборатория независима от производства — это принципиально.\n\n3. Output: G × W × V. Факт ÷ План. Снижать план нельзя — повышай способность системы.\n\n4. Process: строго по SOP. Самодеятельность = вариативность = невозможно найти причину.\n\n5. Data: честные цифры. «Без калибровки данные — это мнение». Лабораторная верификация обязательна.\n\n6. Planning: реалистичный план учитывает GSM, ширину, мощность, ремонты. «План = расчётная способность, не желание».`},
    {title:"Энергетика и механика",body:`Связка: Энергетика + Механика → создают условия → LVP → результат (QCD).\n\nЭнергетика (5 опор):\nReliability → Efficiency (кВт/т min) → Control (учёт по участкам) → Process & Standards → Development (Solar)\n«Экономия через режим, не через ограничение производства»\n\nМеханика (5 опор):\nReliability → Maintenance & Standards (ППР) → Spare Parts (ЗИП) → Control (коды простоев) → Improvement\n«Плановый ремонт дешевле аварийного в 3–5 раз»\n«Не чинить — устранять причину»`},
    {title:"AI в производстве",body:`Level 1 (пассивный): передаём данные → AI анализирует → рекомендации за 2 минуты.\n• Сменный отчёт: план/факт, простои по кодам, параметры\n• Качество: факт vs ТУ, тренды, гипотезы причин\n• Энергетика: кВт/т, нестабильность режимов\n• Механика: паттерны поломок, идеи по ППР\n\nLevel 2 (агенты): AI читает ERP сам → сигналит → отчёт.\nData Agent → LVP Control Agent → Quality Agent → Maintenance Agent → Energy Agent → Summary Agent\n\n«Без данных AI — это мнение».\nЧеловек обязателен: Focus, ключевые решения, финальное одобрение.`}
  ]},
  {id:"sales",title:"Sales & Marketing",icon:"↗",color:"#5b9cf6",modules:[
    {title:"Продуктовая матрица MP",body:`OqLayner: ★★★ Look | ★ Strength | ★ Cost\nБелоснежный вид, яркая печать. White Inside — внутренний слой гофрокартона.\n\nCeLa: ★★★ Look + Strength | ★ Cost\nСочетание прочности и вида. Заменяет импортные лайнеры. Удалённые регионы и экспорт.\n\nK0: ★★ Look | ★★★ Strength | ★★ Cost\nМаксимальный BCT. Для тяжёлых грузов и экспортной упаковки.\n\nK1: ★ Look | ★★ Strength | ★★★ Cost\nЭкономия. Замена K0 там, где прочность не критична.\n\nB2-100: ★★★ Cost | ★★★ Speed\nРаботает вместо 120 г/м². Стабильный GSM = контроль маржи гофровика. Без обрывов А-класс.`},
    {title:"Продуктовая матрица KW",body:`RSC: Slotter+Flexo, K1/B2. ★★★ ECO + SPEED. Только Хорезм — не везти в Ташкент.\n\nwRSC: OqLayner/CeLa. ★★★ WHITE. Премиальный RSC с белым внутренним слоем.\n\nDie-cut non-RSC: K0/CeLa. ★★★ ENG. Сложные формы — дифференциация и премиум.\n\nSRP: K0/OqLayner. ★★★ ENG + SRP. Shelf Ready Packaging — упаковка, которая сама продаёт.\n\nSnP: OqLayner/CeLa. ★★★ WHITE. Офсетная печать, максимальный вид, высокая маржа.\n\nПравило: RSC/Гофролист — только Хорезм. SRP/SnP/die-cut — любой регион.`},
    {title:"Формула контента",body:`Контент = Направление × Опоры × Элементы\n\n5 направлений:\n1. Factory — производство, стабильность, доверие через реальность\n2. Product/SRP — конкретный продукт и его ценность для клиента\n3. Client/Result — кейс: было → стало\n4. Comparison — до/после, vs рынок, vs импорт\n5. Education — почему м² важнее кг, почему SRP > RSC\n\n5 опор: Focus → Value → Proof → Enable → Consistency\n\n6 элементов: Проблема → Решение → Результат → Доказательство → Визуал → CTA\n\nПравило: 1 пост = 1 value. Без смешивания. Клиент понимает за 3 секунды.`},
    {title:"Навигационные карты продаж",body:`MP по регионам:\n• Хорезм + Каракалпакия: ВСЕ продукты — высокий приоритет\n• Ташкент: OqLa, CeLa, K0, K1, Б0/1, Б2-100 — высокий. Б2-120 — средний\n• Экспорт (ближние): OqLa, CeLa — высокий. K0, K1 — средний. Б2-120 — нет\n\nKW по регионам:\n• Хорезм: все продукты — высокий приоритет\n• Ташкент: non-RSC, wRSC — высокий. RSC — средний. SnP, SnP-Lam — высокий\n• Экспорт: non-RSC, wRSC — средний. SnP, SnP-Lam — высокий. RSC — нет\n\nФлаг: RSC в Ташкент → анализ маржи с учётом логистики обязателен.`}
  ]},
  {id:"people",title:"HR, Safety & COSS",icon:"◉",color:"#c084f5",modules:[
    {title:"HR — система людей под процессы",body:`HR строит систему людей под систему процессов — не просто закрывает вакансии.\nLVP держится на людях: без правильной команды система рухнет.\n\n5 опор HR:\n1. Hiring: отбор по культуре — честность + системность. Способность работать по правилам.\n2. Retention: PIB — понятные условия, предсказуемость, своевременная оплата.\n3. Development: MPLES (LMS), SOP-обучение, KMS, развитие руководителей.\n4. Performance: KPI из BSC, прозрачная оценка, результат ↔ оплата.\n5. Culture & Discipline: честность с ERP, системность, дисциплина, безопасность как поведение.`},
    {title:"Safety — Zero Vision",body:`Zero Vision: любой инцидент можно и нужно предотвратить.\n\n5 опор:\n1. Risk Identification: Near Miss в ERP анонимно. Реестр рисков. «Выявлять, не скрывать».\n2. Prevention: LOTO (защита энергии), Poka-Yoke, Permit to Work через ERP.\n3. Behavior & Culture: наблюдение, обратная связь. «Не виноват — почему произошло».\n4. Compliance + Practical Safety: обучение на СВОЁМ оборудовании. Аварийные тренировки.\n5. Visual Management: зонирование, знаки, AI-постеры, микро-обучение.\n\nПравильные KPI: не «ноль травм», а:\n• Near Miss зафиксировано\n• Risk closure % ≥ 90% за 30 дней`},
    {title:"COSS — Company OS",body:`«Компания управляется системой, а не вручную».\n\n6 опор COSS:\n1. Strategy & BSC: стратегия оцифрована в цели, KPI, планы\n2. Process Design: процессы понятны, без хаоса и дублирования\n3. ERP: ВСЕ операции через ERP. Нет обходов — без исключений.\n4. BI & Data: единая правда в цифрах\n5. Execution Discipline: процессы соблюдаются реально, не на бумаге\n6. Automation & AI: быстрее, умнее, меньше ручного труда\n\nЦепочка: Стратегия → Процессы → Исполнение → Данные → Дисциплина → Ускорение\n«COSS думает, AI проверяет».`},
    {title:"Бренды: MP, KW, SnP",body:`MP + SnP — независимый поставщик материалов:\n• Клиенты: производители гофротары\n• Принципы: нейтральность, конфиденциальность, независимость\n• Правило: KWF = обычный клиент MP в публичной коммуникации\n\nKWF — отдельный производитель упаковки:\n• Клиенты: B2B-компании, которым нужна упаковка\n• Принципы: стабильность, качество, надёжность\n• Плюс: близость к MP = преимущество для клиента\n• Каналы: + Instagram/Facebook (только B2B-кейсы)\n\nЗапрещено: массовая реклама, демпинг, смешение брендов, обещания без подтверждения.\n1 маркетинг-менеджер на 3 бренда — разные посылы, единая система.`}
  ]},
  {id:"finance",title:"Finance & Supply",icon:"◇",color:"#f87171",modules:[
    {title:"Finance — центр решений",body:`Finance ≠ бухгалтерия. Finance принимает решения: платить, инвестировать, останавливать.\n\nПринципы:\n• «Сначала считаем — потом решаем»\n• «Прибыль ≠ деньги» — Cash Gap убивает даже прибыльные компании\n• «Цена покрывает себестоимость» — без исключений\n• «Группа сильнее компании»\n\n6 опор: Cashflow & Liquidity → Plan/Fact/Action → Cost & Pricing → Financial Control → Strategic Finance → Intercompany Control\n\nFinance решает — Accounting фиксирует.`},
    {title:"OCC — контроль макулатуры",body:`Контроль OCC = контроль производства.\n\n6 опор Снабжения макулатуры:\n1. Контроль рынка: знаем всех поставщиков, объёмы, сезонность, цены\n2. Сеть поставщиков: ≥ 5 активных. Нет зависимости от одного.\n3. Лояльность: «Деньги вовремя = рынок у тебя»\n4. Цена/Объём: оптимальный баланс запаса и закупочной цены\n5. Скорость операций: быстрая приёмка, взвешивание, оплата\n6. Риски: сезонные спады, серые зоны — всё в ERP\n\nПравило: запас OCC ≥ 7 дней. Алерт при < 5 дней.`},
    {title:"Снабжение прочих материалов",body:`Прочие материалы кажутся второстепенными — но их отсутствие так же останавливает линию.\n\nКатегории:\n• Химия: крахмал, клей, добавки (без крахмала нет склейки гофрокартона)\n• Краски и растворители для печати\n• ЗИП (запасные части и инструменты для механики)\n• Упаковочные материалы для готовой продукции\n\n5 опор Снабжения прочих:\n1. Номенклатура критических материалов в ERP с нормами запаса\n2. ≥ 2 поставщика на каждую критическую позицию\n3. Импортные альтернативы для ключевых позиций\n4. Входной контроль качества — сертификаты обязательны\n5. Аварийный запас по топ-10 критических позиций`},
    {title:"Логистика и бухгалтерия",body:`ЛОГИСТИКА — движет, а не просто перевозит:\n5 опор: Доступность → Стоимость → Скорость → Надёжность → ERP контроль\n«Нет машины — нет движения»\n«Логистика = продолжение производства»\n\nБУХГАЛТЕРИЯ — фиксация и защита:\n5 опор: Учёт → Налоги → Договора → Риски → ERP документооборот\nAI Level 1: OCR документов, авто-проверка ошибок, выявление аномалий.\nKPI: нет штрафов, прозрачность, снижение правовых рисков.`}
  ]}
];

function LearnView(){

  const [lesson,setLesson]=useState(0);
  const m=LEARN.find(x=>x.id===mod);
  useEffect(()=>setLesson(0),[mod]);

  return e("div",{className:"sidebar-layout"},
    e("div",{className:"sidebar-left"},
      e("div",{style:{fontSize:9,fontWeight:600,color:"#6060a0",padding:"0 4px",marginBottom:8,letterSpacing:"0.08em",whiteSpace:"nowrap"}},"МОДУЛИ"),
      LEARN.map(x=>e("button",{key:x.id,onClick:()=>setMod(x.id),style:{
        display:"flex",alignItems:"center",gap:6,width:"100%",padding:"7px 8px",borderRadius:8,border:"none",
        cursor:"pointer",textAlign:"left",
        background:mod===x.id?x.color+"20":"transparent",
        color:mod===x.id?x.color:"#9090b0",
        fontWeight:mod===x.id?600:400,fontSize:11,marginBottom:2,transition:"all 0.15s",lineHeight:1.4
      }},e("span",{style:{fontSize:14,flexShrink:0}},x.icon),x.title))
    ),
    e("div",{style:{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}},
      e("div",{style:{padding:"10px 16px",borderBottom:"1px solid #22222a",background:"#12121a",
        display:"flex",alignItems:"center",gap:8}},
        e("span",{style:{fontSize:18}},m.icon),
        e("div",null,
          e("div",{style:{fontFamily:"'Playfair Display',serif",fontSize:16,color:m.color,fontWeight:600}},m.title),
          e("div",{style:{fontSize:11,color:"#6060a0"}},m.modules.length+" уроков")
        )
      ),
      e("div",{style:{display:"flex",flex:1,overflow:"hidden"}},
        e("div",{className:"sidebar-mid"},
          m.modules.map((l,i)=>e("button",{key:i,onClick:()=>setLesson(i),style:{
            display:"block",width:"100%",padding:"10px 10px",borderRadius:8,border:"none",
            cursor:"pointer",textAlign:"left",fontSize:11,fontWeight:500,marginBottom:4,lineHeight:1.45,
            background:lesson===i?m.color+"25":"#1e1e28",
            color:lesson===i?m.color:"#9090b0",
            borderLeft:lesson===i?`3px solid ${m.color}`:"3px solid transparent",
            transition:"all 0.2s"
          }},e("div",{style:{fontSize:9,opacity:0.7,marginBottom:2,letterSpacing:"0.04em"}},[`УРОК ${i+1}`]),l.title))
        ),
        e("div",{className:"sidebar-content",style:{flex:1,padding:"22px 24px",overflowY:"auto",background:"#0f0f16"}},
          e("div",{style:{maxWidth:620}},
            e("div",{style:{fontSize:10,fontWeight:600,color:m.color,marginBottom:10,letterSpacing:"0.08em"}},
              `${m.title.toUpperCase()} · УРОК ${lesson+1}`),
            e("h2",{style:{fontFamily:"'Playfair Display',serif",fontSize:21,color:"#f0eff8",marginBottom:18,lineHeight:1.35,fontWeight:600}},
              m.modules[lesson].title),
            e("div",{style:{fontSize:13,color:"#c0bee8",lineHeight:1.9,whiteSpace:"pre-line",
              borderLeft:`3px solid ${m.color}`,
              background:"#16161e",borderRadius:"0 10px 10px 0",padding:"16px 18px"
            }},m.modules[lesson].body),
            e("div",{style:{display:"flex",justifyContent:"space-between",marginTop:22,gap:8,flexWrap:"wrap"}},
              lesson>0?e("button",{onClick:()=>setLesson(lesson-1),style:{padding:"8px 16px",borderRadius:8,
                border:"1px solid #32323e",background:"#1e1e28",fontSize:12,color:"#b0aed0"}},"← Назад"):e("div"),
              lesson<m.modules.length-1&&e("button",{onClick:()=>setLesson(lesson+1),style:{padding:"8px 16px",borderRadius:8,
                border:`1px solid ${m.color}66`,background:m.color+"20",color:m.color,fontSize:12,fontWeight:600}},
                "Следующий →")
            ),
            e("div",{style:{display:"flex",gap:6,marginTop:16,justifyContent:"center"}},
              m.modules.map((_,i)=>e("div",{key:i,onClick:()=>setLesson(i),style:{
                width:i===lesson?18:6,height:6,borderRadius:99,cursor:"pointer",
                background:i===lesson?m.color:"#2e2e40",
                boxShadow:i===lesson?`0 0 6px ${m.color}`:"none",
                transition:"all 0.3s"}}))
            )
          )
        )
      )
    )
  );
}
