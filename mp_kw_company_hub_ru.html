function getKPIsForDept(deptId){
  const res=[];
  BSC.forEach(p=>p.kpis.forEach(k=>{
    const isOwner=k.owners.includes(deptId);
    const isSupport=k.support.includes(deptId);
    if(isOwner||isSupport) res.push({...k,isOwner,perspColor:p.perspColor,perspBg:p.perspBg,perspective:p.perspective});
  }));
  return res;
}

  return e("div",{style:{background:"white",borderRadius:12,

    e("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8,marginBottom:3}},

    e("div",{style:{fontSize:11,fontWeight:500,color:"#14120e",marginBottom:3}},k.ru),

        DEPTS.map(d=>{

const LEARN=[
  {id:"core",title:"Core Strategy",icon:"◈",color:"#b8922a",modules:[
    {title:"QCD — внешнее обещание",body:`QCD — три столпа, через которые клиент оценивает поставщика.\n\nQuality: продукт соответствует стандарту каждый раз. GSM, BCT, влажность, белизна — лабораторный контроль каждой партии. Не «в целом нормально» — всегда в допуске.\n\nCost: цена реальная, покрывает себестоимость с маржой. Снижение cost — через LVP и правильный материал, не через демпинг.\n\nDelivery: OTIF ≥ 95%. Срыв поставки останавливает производство клиента. Продукт ничего не стоит без поставки.`},
    {title:"PIB — внутреннее обещание",body:`PIB — зеркало QCD, направленное внутрь. Без PIB нет команды, без команды нет LVP.\n\nPerformance: понятные задачи, исправное оборудование, чёткий план. Не «старайся больше» — а «вот SOP, вот инструмент, вот цель».\n\nIncome: справедливая и своевременная оплата. «Справедливая и своевременная оплата — основа доверия». Задержка зарплаты разрушает доверие быстрее всего.\n\nBalance: предсказуемый график, уважение к личному времени. Люди, которые не выгорают — работают стабильно и долго.`},
    {title:"Value Selling — ценность, не продукт",body:`MP продаёт улучшение продукта клиента: вид, прочность, стоимость, скорость производства.\nKW продаёт формат-решение: прочная, доступная, быстрая, привлекательная, продающая.\n\n1 клиент = 1 главная боль. Сначала диагностика — потом предложение.\n\nValue-режимы KW:\n• Speed → «линия не остановится»\n• Economy → «снизили cost, не качество»\n• Engineering → «довезли без потерь»\n• SRP → «продали больше с полки»\n• White → «выглядишь дороже конкурента»\n\nПравило: 1 режим — 1 встреча. Не смешивать. Если проиграл по цене — измени игру.`},
    {title:"Стратегия «Ценность / Расстояние»",body:`Завод в Ургенче. Цена всегда включает доставку.\n\nЛокальный рынок (Хорезм): тотальное доминирование. Все продукты. Максимальный охват сегментов.\n\nУдалённые рынки (Ташкент, Долина, экспорт): только Синий океан.\nЗапрет: RSC и простой флютинг — логистика съедает маржу.\nФокус: MP — CeLa, OqLayner (заменяем импорт). KW — die-cut, SnP, SRP.\n\nФормула: Ценность продукта > Транспортные расходы.\nЧем сложнее продукт — тем шире его география продаж.`}
  ]},
  {id:"lvp",title:"LVP Production",icon:"⬡",color:"#0f5c46",modules:[
    {title:"Что такое LVP",body:`LVP (Low Variance Production) — система стабильно реализует максимальную расчётную способность каждый день.\n\nLVP — это НЕ: медленно, осторожно, «средне».\nLVP — это: одинаковый процесс → одинаковые параметры → одинаковый результат.\n\nVariation↓ = Control↑\nСтабильные 45 т/смену лучше хаотичных 55.\nПроцесс равен своему ХУДШЕМУ дню.\n\nУровни зрелости:\n1. Хаос → 2. Стабильно плохо → 3. Стабильно в норме → 4. Стабильно на максимуме\nLVP = движение к уровню 4.`},
    {title:"6 опор LVP",body:`1. Safety: безопасная среда + дисциплина поведения. Нет травм → нет аварийных остановок → стабильный выпуск.\n\n2. Quality: всегда в допуске. Лаборатория независима от производства — это принципиально.\n\n3. Output: G × W × V. Факт ÷ План. Снижать план нельзя — нужно повышать способность системы.\n\n4. Process: строго по SOP. Самодеятельность = вариативность = невозможно найти причину.\n\n5. Data: честные цифры. «Без калибровки данные — это мнение». Лабораторная верификация обязательна.\n\n6. Planning: реалистичный план учитывает GSM, ширину, мощность, ремонты. «План = расчётная способность, не желание».`},
    {title:"Энергетика и механика",body:`Связка: Энергетика + Механика → создают условия → LVP → результат (QCD).\n\nЭнергетика (5 опор):\nReliability → Efficiency (кВт/т min) → Control (учёт по участкам) → Process & Standards → Development (Solar)\n«Экономия через режим, не через ограничение производства»\n\nМеханика (5 опор):\nReliability → Maintenance & Standards (ППР) → Spare Parts (ЗИП) → Control (коды простоев) → Improvement\n«Плановый ремонт дешевле аварийного в 3-5 раз»\n«Не чинить — устранять причину»`},
    {title:"AI в производстве",body:`Level 1 (пассивный): передаём данные → AI анализирует → рекомендации за 2 минуты.\n• Сменный отчёт: план/факт, простои по кодам, параметры\n• Качество: факт vs ТУ, тренды, гипотезы причин\n• Энергетика: кВт/т, нестабильность режимов\n• Механика: паттерны поломок, идеи по ППР\n\nLevel 2 (агенты): AI читает ERP сам → сигналит → отчёт.\nData Agent → LVP Control Agent → Quality Agent → Maintenance Agent → Energy Agent → Summary Agent\n\nПравило: «Без данных AI — это мнение».\nЧеловек обязателен: Focus, ключевые решения, финальное одобрение.`}
  ]},
  {id:"sales",title:"Sales & Marketing",icon:"↗",color:"#163a6b",modules:[
    {title:"Продуктовая матрица MP",body:`OqLayner: ★★★ Look | ★ Strength | ★ Cost\nБелоснежный вид, яркая печать. White Inside — внутренний слой гофрокартона.\n\nCeLa: ★★★ Look + Strength | ★ Cost\nСочетание прочности и вида. Заменяет импортные лайнеры. Удалённые регионы и экспорт.\n\nK0: ★★ Look | ★★★ Strength | ★★ Cost\nМаксимальный BCT. Для тяжёлых грузов и экспортной упаковки.\n\nK1: ★ Look | ★★ Strength | ★★★ Cost\nЭкономия. Замена K0 там, где прочность не критична.\n\nB2-100: ★★★ Cost | ★★★ Speed\nРаботает вместо 120 г/м². Стабильный GSM = контроль маржи гофровика. Без обрывов А-класс.`},
    {title:"Продуктовая матрица KW",body:`RSC: Slotter+Flexo, K1/B2. ★★★ ECO + SPEED. Только Хорезм — не везти в Ташкент.\n\nwRSC: OqLayner/CeLa. ★★★ WHITE. Премиальный RSC с белым внутренним слоем.\n\nDie-cut non-RSC: K0/CeLa. ★★★ ENG. Сложные формы — дифференциация и премиум.\n\nSRP: K0/OqLayner. ★★★ ENG + SRP. Shelf Ready Packaging — упаковка, которая сама продаёт.\n\nSnP: OqLayner/CeLa. ★★★ WHITE. Офсетная печать, максимальный вид, высокая маржа.\n\nПравило: RSC/Гофролист — только Хорезм. SRP/SnP/die-cut — любой регион.`},
    {title:"Формула контента",body:`Контент = Направление × Опоры × Элементы\n\n5 направлений:\n1. Factory — производство, стабильность, доверие через реальность\n2. Product/SRP — конкретный продукт и его ценность для клиента\n3. Client/Result — кейс: было → стало\n4. Comparison — до/после, vs рынок, vs импорт\n5. Education — почему м² важнее кг, почему SRP > RSC\n\n5 опор: Focus → Value → Proof → Enable → Consistency\n\n6 элементов: Проблема → Решение → Результат → Доказательство → Визуал → CTA\n\nПравило: 1 пост = 1 value. Без смешивания. Клиент понимает за 3 секунды.`},
    {title:"Навигационные карты продаж",body:`MP по регионам:\n• Хорезм + Каракалпакия: ВСЕ продукты — высокий приоритет\n• Ташкент: OqLa, CeLa, K0, K1, Б0/1, Б2-100 — высокий. Б2-120 — средний\n• Экспорт (ближние): OqLa, CeLa — высокий. K0, K1 — средний. Б2-120 — нет\n\nKW по регионам:\n• Хорезм: все продукты — высокий приоритет\n• Ташкент: non-RSC, wRSC — высокий. RSC — средний. SnP, SnP-Lam — высокий\n• Экспорт: non-RSC, wRSC — средний. SnP, SnP-Lam — высокий. RSC — нет\n\nФлаг: RSC в Ташкент или Б2-120 в экспорт → немедленный анализ маржи с учётом логистики.`}
  ]},
  {id:"people",title:"HR, Safety & COSS",icon:"◉",color:"#7a2a6b",modules:[
    {title:"HR — система людей под процессы",body:`HR строит систему людей под систему процессов — не просто закрывает вакансии.\nLVP держится на людях: без правильной команды система рухнет.\n\n5 опор HR:\n1. Hiring: отбор по культуре — честность + системность. Capacity работать по правилам.\n2. Retention: PIB — понятные условия, предсказуемость, своевременная оплата.\n3. Development: MPLES (LMS), SOP-обучение, KMS, развитие руководителей.\n4. Performance: KPI из BSC, прозрачная оценка, результат ↔ оплата.\n5. Culture & Discipline: честность с ERP, системность, дисциплина, безопасность как поведение.\n\nРиск: HR как «кадровик» → система разваливается.\nЦель: HR как строитель системы людей → компания работает стабильно.`},
    {title:"Safety — Zero Vision",body:`Zero Vision: любой инцидент можно и нужно предотвратить.\n\n5 опор:\n1. Risk Identification: Near Miss в ERP анонимно. Реестр рисков. «Выявлять, не скрывать».\n2. Prevention: LOTO (защита энергии при ремонте), Poka-Yoke, Permit to Work через ERP.\n3. Behavior & Culture: наблюдение за поведением, обратная связь. «Не виноват — почему произошло».\n4. Compliance + Practical Safety: обучение на СВОЁМ оборудовании. Аварийные тренировки.\n5. Visual Management: зонирование, знаки, AI-постеры, микро-обучение, геймификация.\n\nПравильные KPI: не «ноль травм» (результат, не управление), а:\n• Near Miss зафиксировано\n• % закрытых рисков ≥ 90% за 30 дней`},
    {title:"COSS — Company OS",body:`«Компания управляется системой, а не вручную».\n\n6 опор COSS:\n1. Strategy & BSC: стратегия оцифрована в цели, KPI, планы действий\n2. Process Design: процессы понятны, без хаоса и дублирования\n3. ERP: ВСЕ операции через ERP. Нет обходов — без исключений.\n4. BI & Data: единая правда в цифрах\n5. Execution Discipline: процессы соблюдаются реально, не на бумаге\n6. Automation & AI: быстрее, умнее, меньше ручного труда\n\nЦепочка: Стратегия → Процессы → Исполнение → Данные → Дисциплина → Ускорение\n«COSS думает, AI проверяет».`},
    {title:"Бренды: MP, KW, SnP",body:`MP + SnP — единый блок, независимый поставщик материалов:\n• Клиенты: производители гофротары\n• Принципы: нейтральность, конфиденциальность, независимость\n• Правило: KWF = обычный клиент MP в публичной коммуникации\n\nKWF — отдельный производитель упаковки:\n• Клиенты: B2B-компании, которым нужна упаковка\n• Принципы: стабильность, качество, надёжность\n• Плюс: географическая близость к MP = преимущество для клиента\n• Каналы: + Instagram/Facebook (только B2B-кейсы)\n\nЗапрещено: массовая реклама, демпинг, смешение брендов, обещания без подтверждения.\n1 маркетинг-менеджер на 3 бренда. Разные посылы — единая система управления.`}
  ]},
  {id:"finance",title:"Finance & Supply",icon:"◇",color:"#6b1a1a",modules:[
    {title:"Finance — центр решений",body:`Finance ≠ бухгалтерия. Finance принимает решения: платить, инвестировать, останавливать.\n\nПринципы:\n• «Сначала считаем — потом решаем»\n• «Прибыль ≠ деньги» — можно быть прибыльным и обанкротиться из-за Cash Gap\n• «Цена покрывает себестоимость» — без исключений\n• «Группа сильнее компании»\n\n6 опор: Cashflow & Liquidity → Plan/Fact/Action → Cost & Pricing → Financial Control → Strategic Finance → Intercompany Control\n\nMetrics: Cash Gap, Gross Margin %, оборачиваемость, долговая нагрузка.\nFinance решает — Accounting фиксирует.`},
    {title:"OCC — контроль макулатуры",body:`Контроль OCC = контроль производства.\n\n6 опор Снабжения макулатуры:\n1. Контроль рынка: знаем всех поставщиков, объёмы, сезонность, цены\n2. Сеть поставщиков: ≥ 5 активных. Нет зависимости от одного.\n3. Лояльность: «Деньги вовремя = рынок у тебя»\n4. Цена/Объём: оптимальный баланс запаса и стоимости закупки\n5. Скорость операций: быстрая приёмка, взвешивание, оплата\n6. Риски: сезонные спады, серые зоны — всё фиксируется в ERP\n\nПравило: запас OCC ≥ 7 дней. Алерт при < 5 дней. Ноль остановок из-за OCC.`},
    {title:"Снабжение прочих материалов",body:`Прочие материалы кажутся второстепенными — но их отсутствие так же останавливает линию.\n\nКатегории:\n• Химия: крахмал, клей, добавки (без крахмала нет склейки гофрокартона)\n• Краски и растворители для печати\n• ЗИП (запасные части и инструменты для механики)\n• Упаковочные материалы для готовой продукции\n\n5 опор Снабжения прочих:\n1. Номенклатура критических материалов в ERP с нормами запаса\n2. ≥ 2 поставщика на каждую критическую позицию (альтернатива)\n3. Импортные альтернативы для ключевых позиций (химия, ЗИП)\n4. Входной контроль качества — сертификаты обязательны\n5. Аварийный запас по топ-10 критических позиций`},
    {title:"Логистика и бухгалтерия",body:`ЛОГИСТИКА — движет, а не просто перевозит:\n5 опор: Доступность → Стоимость → Скорость → Надёжность → ERP контроль\n«Нет машины — нет движения»\n«Логистика = продолжение производства»\nСрыв логистики = срыв OTIF = потеря клиента.\n\nБУХГАЛТЕРИЯ — фиксация и защита:\n5 опор: Учёт (все операции в ERP) → Налоги (своевременно) → Договора → Риски → ERP документооборот\nAI Level 1: OCR документов, авто-проверка ошибок, выявление аномалий в платежах.\nKPI: нет штрафов, прозрачность, снижение правовых рисков.`}
  ]}
];

function LearnView(){
  const [mod,setMod]=useState("core");
  const [lesson,setLesson]=useState(0);
  const m=LEARN.find(x=>x.id===mod);
  useEffect(()=>setLesson(0),[mod]);
  return e("div",{style:{display:"flex",minHeight:"calc(100vh - 44px)"}},
    e("div",{style:{width:150,flexShrink:0,borderRight:"1px solid #e2ddd2",padding:"10px 6px",background:"#f9f7f2",overflowY:"auto"}},
      e("div",{style:{fontSize:10,fontWeight:500,color:"#7a766d",padding:"0 6px",marginBottom:8,letterSpacing:"0.06em"}},"МОДУЛИ"),
      LEARN.map(x=>e("button",{key:x.id,onClick:()=>setMod(x.id),style:{
        display:"flex",alignItems:"center",gap:6,width:"100%",padding:"7px 8px",borderRadius:7,border:"none",
        cursor:"pointer",textAlign:"left",background:mod===x.id?x.color+"15":"transparent",
        color:mod===x.id?x.color:"#3d3a33",fontWeight:mod===x.id?500:400,fontSize:11,marginBottom:2,transition:"all 0.15s"
      }},e("span",{style:{fontSize:13,flexShrink:0}},x.icon),x.title))
    ),
    e("div",{style:{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}},
      e("div",{style:{padding:"10px 16px",borderBottom:"1px solid #e2ddd2",background:"white",display:"flex",alignItems:"center",gap:8}},
        e("span",{style:{fontSize:18}},m.icon),
        e("div",null,
          e("div",{style:{fontFamily:"'Playfair Display',serif",fontSize:16,color:m.color}},m.title),
          e("div",{style:{fontSize:11,color:"#7a766d"}},m.modules.length+" уроков")
        )
      ),
      e("div",{style:{display:"flex",flex:1,overflow:"hidden"}},
        e("div",{style:{width:180,flexShrink:0,borderRight:"1px solid #e2ddd2",padding:"8px",background:"#f0ede4",overflowY:"auto"}},
          m.modules.map((l,i)=>e("button",{key:i,onClick:()=>setLesson(i),style:{
            display:"block",width:"100%",padding:"9px 10px",borderRadius:7,border:"none",cursor:"pointer",
            textAlign:"left",fontSize:11,fontWeight:500,marginBottom:3,lineHeight:1.4,
            background:lesson===i?m.color:"white",color:lesson===i?"white":"#3d3a33",
            boxShadow:lesson===i?"0 2px 6px "+m.color+"44":"none",transition:"all 0.2s"
          }},e("div",{style:{fontSize:9,opacity:0.7,marginBottom:1}},`Урок ${i+1}`),l.title))
        ),
        e("div",{style:{flex:1,padding:"22px 26px",overflowY:"auto",background:"white"}},
          e("div",{style:{maxWidth:580}},
            e("div",{style:{fontSize:10,fontWeight:500,color:m.color,marginBottom:8,letterSpacing:"0.08em"}},[m.title.toUpperCase()," · УРОК ",lesson+1]),
            e("h2",{style:{fontFamily:"'Playfair Display',serif",fontSize:20,color:"#14120e",marginBottom:14,lineHeight:1.35}},m.modules[lesson].title),
            e("div",{style:{fontSize:13,color:"#3d3a33",lineHeight:1.85,whiteSpace:"pre-line",
              borderLeft:`3px solid ${m.color}`,background:"#f9f7f2",borderRadius:"0 8px 8px 0",padding:"12px 14px"
            }},m.modules[lesson].body),
            e("div",{style:{display:"flex",justifyContent:"space-between",marginTop:18,gap:8}},
              lesson>0?e("button",{onClick:()=>setLesson(lesson-1),style:{padding:"7px 13px",borderRadius:7,
                border:"1px solid #e2ddd2",background:"#f0ede4",cursor:"pointer",fontSize:12,color:"#3d3a33"}},"← Назад"):e("div"),
              lesson<m.modules.length-1&&e("button",{onClick:()=>setLesson(lesson+1),style:{padding:"7px 13px",borderRadius:7,
                border:"none",background:m.color,color:"white",cursor:"pointer",fontSize:12,fontWeight:500}},"Следующий →")
            ),
            e("div",{style:{display:"flex",gap:5,marginTop:12,justifyContent:"center"}},
              m.modules.map((_,i)=>e("div",{key:i,onClick:()=>setLesson(i),style:{
                width:i===lesson?14:5,height:5,borderRadius:99,cursor:"pointer",
                background:i===lesson?m.color:"#e2ddd2",transition:"all 0.3s"}}))
            )
          )
        )
      )
    )
  );
}

function RoadView(){
  const [open,setOpen]=useState(0);
  return e("div",{style:{padding:"16px",maxWidth:900,margin:"0 auto"}},
    e("div",{style:{marginBottom:20}},
      e("div",{style:{fontFamily:"'Playfair Display',serif",fontSize:24,color:"#14120e",marginBottom:3}},"Strategic Roadmap"),
      e("div",{style:{fontSize:13,color:"#7a766d"}},"4 фазы · 24 месяца · путь к автономной компании · 13 отделов")
    ),
    ROADMAP.map((ph,pi)=>
      e("div",{key:pi,style:{marginBottom:12}},
        e("div",{onClick:()=>setOpen(open===pi?null:pi),style:{
          display:"flex",alignItems:"center",gap:10,padding:"12px 15px",
          background:open===pi?ph.color:"white",color:open===pi?"white":"#14120e",
          borderRadius:open===pi?"10px 10px 0 0":"10px",border:`1px solid ${ph.color}44`,
          cursor:"pointer",transition:"all 0.2s",userSelect:"none",
          borderBottom:open===pi?"none":undefined}},
          e("div",{style:{width:30,height:30,borderRadius:"50%",
            background:open===pi?"rgba(255,255,255,0.2)":ph.bg,
            border:`2px solid ${open===pi?"rgba(255,255,255,0.4)":ph.color}`,
            display:"flex",alignItems:"center",justifyContent:"center",
            fontFamily:"'Playfair Display',serif",fontWeight:600,fontSize:13,
            color:open===pi?"white":ph.color,flexShrink:0}},pi+1),
          e("div",{style:{flex:1}},
            e("div",{style:{fontFamily:"'Playfair Display',serif",fontSize:15,lineHeight:1.2}},ph.phase),
            e("div",{style:{fontSize:11,opacity:0.75,marginTop:2}},ph.period+" · "+ph.tagline)
          ),
          e("span",{style:{fontSize:11,fontWeight:500,padding:"2px 9px",borderRadius:99,
            background:open===pi?"rgba(255,255,255,0.2)":ph.color+"18",
            color:open===pi?"white":ph.color}},ph.goals.length+" целей")
        ),
        open===pi&&e("div",{style:{border:`1px solid ${ph.color}33`,borderTop:"none",borderRadius:"0 0 10px 10px",overflow:"hidden"}},
          ph.goals.map((item,gi)=>
            e("div",{key:gi,style:{padding:"12px 15px",background:gi%2===0?"#faf9f5":"white",
              borderBottom:gi<ph.goals.length-1?"1px solid #f0ede4":"none"}},
              e("div",{style:{display:"flex",alignItems:"flex-start",gap:9}},
                e("div",{style:{width:18,height:18,borderRadius:5,background:ph.bg,
                  border:`1px solid ${ph.color}44`,display:"flex",alignItems:"center",justifyContent:"center",
                  flexShrink:0,marginTop:1}},e("div",{style:{width:5,height:5,borderRadius:"50%",background:ph.color}})),
                e("div",{style:{flex:1}},
                  e("div",{style:{fontSize:13,fontWeight:500,color:"#14120e",marginBottom:5}},item.g),
                  e("div",{style:{display:"flex",gap:4,flexWrap:"wrap",marginBottom:5}},
                    item.dept.map(did=>{
                      const d=DEPTS.find(x=>x.id===did);
                      return e("span",{key:did,style:{fontSize:10,padding:"2px 6px",borderRadius:99,
                        background:d.bg,color:d.color,border:`1px solid ${d.color}44`}},d.name);
                    })
                  ),
                  e("div",{style:{fontSize:12,color:"#3d3a33",lineHeight:1.65,background:ph.bg,
                    borderRadius:7,padding:"7px 10px"}},
                    e("span",{style:{fontSize:10,fontWeight:500,color:ph.color,display:"block",marginBottom:2,letterSpacing:"0.04em"}},"НА ПРАКТИКЕ"),
                    item.d
                  )
                )
              )
            )
          )
        )
      )
    ),
    e("div",{style:{marginTop:20,padding:"15px 18px",background:"#14120e",borderRadius:12}},
      e("div",{style:{fontFamily:"'Playfair Display',serif",fontSize:16,color:"#f5e6c0",marginBottom:7}},"Пункт назначения"),
      e("div",{style:{fontSize:13,color:"#d0c9ba",lineHeight:1.8}},"Компания управляется системой, а не вручную. 13 отделов работают по BSC. AI-агенты анализируют. Люди решают. Вариативность низкая, выпуск предсказуем, клиенты получают QCD каждый раз. MP и KW — надёжный источник в регионе: не потому что дёшево — а потому что стабильно и ценно.")
    )
  );
}

function App(){
  const [tab,setTab]=useState("dept");
  return e("div",{style:{minHeight:"100vh",background:"#f9f7f2"}},
    e(Nav,{tab,set:setTab}),
    tab==="dept"&&e(DeptView),
    tab==="bsc"&&e(BSCView),
    tab==="learn"&&e(LearnView),
    tab==="road"&&e(RoadView)
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(e(App));
</script>
