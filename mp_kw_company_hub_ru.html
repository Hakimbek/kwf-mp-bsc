        body:`LVP (Low Variance Production) — стратегия производства, при которой система стабильно реализует свою максимальную расчётную способность.

LVP — это НЕ: работать медленно, снижать план, делать «средне, но стабильно». Стабильно плохо — это тоже не LVP.

LVP — это: одинаковый процесс → одинаковые параметры → одинаковый результат каждый день. Каждый день предсказуем.

Главный принцип: стабильность важнее пиков.
• Случайный максимум — не достижение
• Повторяемый результат — это управление

Формула: Variation ↓ = Control ↑

4 уровня зрелости производства:
1. Хаос
2. Стабильно плохо
3. Стабильно в норме
4. Стабильно на максимуме

    e("div",{style:{width:160,flexShrink:0,borderRight:"1px solid #e2ddd2",padding:"12px 8px",background:"#f9f7f2",overflowY:"auto"}},

      D.learning.map(x=>
        e("button",{key:x.id,onClick:()=>setMod(x.id),style:{
          display:"flex",alignItems:"center",gap:7,width:"100%",
          padding:"8px 10px",borderRadius:8,border:"none",cursor:"pointer",textAlign:"left",

      e("div",{style:{padding:"12px 18px",borderBottom:"1px solid #e2ddd2",background:"white",display:"flex",alignItems:"center",gap:10}},
        e("span",{style:{fontSize:20}},m.icon),
        e("div",null,
          e("div",{style:{fontFamily:"'Playfair Display',serif",fontSize:18,color:m.color}},m.title),
          e("div",{style:{fontSize:11,color:"#7a766d"}},m.modules.length+" уроков")
        )
      ),
      e("div",{style:{display:"flex",flex:1,overflow:"hidden"}},
        e("div",{style:{width:200,flexShrink:0,borderRight:"1px solid #e2ddd2",padding:"8px",background:"#f0ede4",overflowY:"auto"}},

/* ─── APP ─── */
function App(){
  const [tab,setTab]=useState("bsc");
  return e("div",{style:{minHeight:"100vh",background:"var(--paper)"}},
    e(Nav,{tab,set:setTab}),
    tab==="bsc"&&e(BSCView),

}

ReactDOM.createRoot(document.getElementById("root")).render(e(App));
