function Nav({tab,set}){

/* ── DEPT VIEW ── */
function DeptView(){
  const [selDept,setSelDept]=useState(null);
  const dept=selDept?DEPTS.find(d=>d.id===selDept):null;

  const getKPIsForDept=(deptId)=>{
    const res=[];
    BSC_DATA.forEach(p=>{
      p.kpis.forEach(k=>{
        const isOwner=k.owners.includes(deptId);
        const isSupport=k.support.includes(deptId);
        if(isOwner||isSupport) res.push({...k,isOwner,perspColor:p.perspColor,perspBg:p.perspBg,perspective:p.perspective});
      });
    });
    return res;
  };

  if(!selDept){
    return e("div",{style:{padding:"18px 16px",maxWidth:1100,margin:"0 auto"}},
      e("div",{style:{marginBottom:20}},
        e("div",{style:{fontFamily:"'Playfair Display',serif",fontSize:26,color:"#14120e",marginBottom:4}},"BSC по отделам"),
        e("div",{style:{fontSize:13,color:"#7a766d"}},"Выберите отдел — увидите все KPI, за которые он отвечает, и свою роль в каждом из них")
      ),
      e("div",{style:{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(180px,1fr))",gap:12}},
        DEPTS.map(d=>{
          const kpis=getKPIsForDept(d.id);
          const owned=kpis.filter(k=>k.isOwner).length;
          const supported=kpis.filter(k=>!k.isOwner).length;
          return e("div",{
            key:d.id,
            onClick:()=>setSelDept(d.id),
            style:{
              background:"white",borderRadius:12,border:`1px solid ${d.color}33`,
              padding:"16px 14px",cursor:"pointer",transition:"all 0.2s",
              boxShadow:"0 1px 6px rgba(0,0,0,0.04)"
            }
          },
            e("div",{style:{fontSize:22,marginBottom:8}},d.icon),
            e("div",{style:{fontFamily:"'Playfair Display',serif",fontSize:15,color:d.color,marginBottom:10,lineHeight:1.3}},d.name),
            e("div",{style:{display:"flex",gap:6,flexWrap:"wrap"}},
              owned>0&&e("span",{style:{fontSize:10,fontWeight:500,padding:"2px 8px",borderRadius:99,
                background:d.color,color:"white"}},`${owned} владелец`),
              supported>0&&e("span",{style:{fontSize:10,padding:"2px 8px",borderRadius:99,
                background:d.bg,color:d.color,border:`1px solid ${d.color}33`}},`${supported} участник`)
            )
          );
        })
      )
    );
  }

  const kpis=getKPIsForDept(selDept);
  const owned=kpis.filter(k=>k.isOwner);
  const supported=kpis.filter(k=>!k.isOwner);

  return e("div",{style:{padding:"18px 16px",maxWidth:1100,margin:"0 auto"}},
    e("div",{style:{display:"flex",alignItems:"center",gap:12,marginBottom:20}},
      e("button",{onClick:()=>setSelDept(null),style:{
        padding:"6px 14px",borderRadius:8,border:"1px solid var(--paper3)",
        background:"var(--paper2)",cursor:"pointer",fontSize:12,color:"#3d3a33"
      }},"← Все отделы"),
      e("div",{style:{display:"flex",alignItems:"center",gap:10}},
        e("span",{style:{fontSize:24}},dept.icon),
        e("div",null,
          e("div",{style:{fontFamily:"'Playfair Display',serif",fontSize:22,color:dept.color}},dept.name),
          e("div",{style:{fontSize:12,color:"#7a766d"}},`${owned.length} KPI в собственности · ${supported.length} KPI в поддержке`)
        )
      )
    ),

    owned.length>0&&e("div",{style:{marginBottom:28}},
      e("div",{style:{
        fontSize:10,fontWeight:500,letterSpacing:"0.08em",color:"#7a766d",marginBottom:12,
        display:"flex",alignItems:"center",gap:8
      }},
        e("span",{style:{display:"inline-block",width:10,height:10,borderRadius:"50%",background:dept.color}}),
        "KPI В ПРЯМОЙ ОТВЕТСТВЕННОСТИ"
      ),
      e("div",{style:{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(320px,1fr))",gap:14}},
        owned.map((k,i)=>e(KPICard,{key:i,k,dept,isOwner:true}))
      )
    ),

    supported.length>0&&e("div",null,
      e("div",{style:{
        fontSize:10,fontWeight:500,letterSpacing:"0.08em",color:"#7a766d",marginBottom:12,
        display:"flex",alignItems:"center",gap:8
      }},
        e("span",{style:{display:"inline-block",width:10,height:2,background:"#7a766d"}}),
        "KPI В ПОДДЕРЖКЕ (вносит вклад, но не главный ответственный)"
      ),
      e("div",{style:{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(320px,1fr))",gap:14}},
        supported.map((k,i)=>e(KPICard,{key:i,k,dept,isOwner:false}))
      )
    )
  );
}

  return e("div",{style:{
    background:"white",borderRadius:12,
    border:`${isOwner?"2":"1"}px solid ${borderColor}`,
    padding:"16px",boxShadow:isOwner?"0 2px 12px "+dept.color+"22":"0 1px 4px rgba(0,0,0,0.04)",
    opacity:isOwner?1:0.85
  }},
    e("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8,marginBottom:4}},
      e("div",{style:{fontFamily:"'Playfair Display',serif",fontSize:15,color:k.perspColor,lineHeight:1.3}},k.name),
      e(Badge,{s:k.status})
    ),
    e("div",{style:{fontSize:11,fontWeight:500,color:"#14120e",marginBottom:2}},k.ru),
    e("div",{style:{fontSize:10,padding:"2px 7px",borderRadius:99,display:"inline-block",marginBottom:12,
      background:k.perspBg,color:k.perspColor,border:`1px solid ${k.perspColor}33`
    }},k.perspective),

    e("div",{style:{
      background:dept.bg,borderRadius:8,padding:"10px 12px",marginBottom:10,
      border:`1px solid ${dept.color}33`
    }},
      e("div",{style:{fontSize:10,fontWeight:500,color:dept.color,marginBottom:4,letterSpacing:"0.04em"}},[dept.name.toUpperCase()," — ",isOwner?"РОЛЬ ВЛАДЕЛЬЦА":"РОЛЬ УЧАСТНИКА"]),
      e("div",{style:{fontSize:12,color:"#3d3a33",lineHeight:1.65}},k.deptRole[dept.id]||"—")
    ),

    [["Что измеряет?",k.what],["Почему важно?",k.why],["Как считается?",k.how],["Целевое значение",k.target]].map(([label,text])=>

}

/* ── LEARNING (compact) ── */
const LEARN=[
  {id:"core",title:"Core Strategy",icon:"◈",color:"#b8922a",modules:[
    {title:"QCD — внешнее обещание",body:`QCD — три столпа, через которые клиент оценивает поставщика.\n\nQuality: продукт соответствует стандарту каждый раз. Не «в целом нормально» — всегда в допуске. GSM, BCT, влажность, белизна — лабораторный контроль каждой партии.\n\nCost: цена реальная, покрывает себестоимость с маржой. Снижение cost идёт через LVP и правильный материал, не через демпинг.\n\nDelivery: OTIF ≥ 95%. Продукт ничего не стоит без поставки. Срыв останавливает производство клиента.`},
    {title:"PIB — внутреннее обещание",body:`PIB — зеркало QCD, направленное внутрь.\n\nPerformance: сотрудники имеют инструменты, условия и понятные цели. Не «старайся больше» — а «вот SOP, вот оборудование, вот план».\n\nIncome: справедливая и своевременная оплата. «Справедливая и своевременная оплата — основа доверия».\n\nBalance: предсказуемый график, уважение к личному времени. Это условие долгосрочной стабильности команды.\n\nБез PIB — LVP рухнет. Правильные люди держат систему.`},
    {title:"Value Selling — ценность, не продукт",body:`MP продаёт улучшение продукта клиента: вид, прочность, стоимость, скорость.\nKW продаёт формат-решение: прочная, доступная, быстрая, привлекательная, продающая.\n\n1 клиент = 1 главная боль. Диагностика — потом предложение.\n\nValue-режимы KW:\n• Speed → «линия не остановится»\n• Economy → «снизили cost»\n• Engineering → «довезли без потерь»\n• SRP → «продали больше с полки»\n• White → «выглядишь дороже»\n\nПравило: 1 режим — 1 встреча. Не смешивать.`},
    {title:"Стратегия «Ценность / Расстояние»",body:`Завод в Ургенче. Цена всегда включает доставку.\n\nЛокальный рынок (Хорезм): тотальное доминирование. Все продукты. Максимальный охват.\n\nУдалённые рынки (Ташкент, Долина, экспорт): только Синий океан. Запрет на RSC и простой флютинг — логистика съедает маржу.\n• MP: CeLa, OqLayner — заменяем импорт\n• KW: die-cut, SnP, SRP\n\nФормула: Ценность продукта > Транспортные расходы. Чем сложнее продукт — тем шире география.`}

  {id:"lvp",title:"LVP Production",icon:"⬡",color:"#0f5c46",modules:[
    {title:"Что такое LVP",body:`LVP (Low Variance Production) — система стабильно реализует максимальную расчётную способность.\n\nLVP — это НЕ: работать медленно, снижать план, делать «средне».\nLVP — это: одинаковый процесс каждый день. Каждый день предсказуем.\n\nГлавный принцип: Variation↓ = Control↑\n\nСтабильные 45 т/смену лучше хаотичных 55.\nПроцесс равен своему ХУДШЕМУ дню.\n\n4 уровня зрелости:\n1. Хаос → 2. Стабильно плохо → 3. Стабильно в норме → 4. Стабильно на максимуме\n\nLVP = движение к уровню 4.`},
    {title:"6 опор LVP",body:`1. Safety: безопасная среда + дисциплина. Нет травм → нет аварийных остановок.\n\n2. Quality: всегда в допуске. Лаборатория независима от производства.\n\n3. Output: G × W × V. Факт ÷ План. Снижать план нельзя — повышай способность системы.\n\n4. Process: строго по SOP. Самодеятельность = вариативность = нет объяснения причин.\n\n5. Data: честные цифры. Без калибровки данные — это мнение. Лабораторная верификация.\n\n6. Planning: реалистичный план. Учитывает GSM, ширину, ремонты. «План = расчётная способность, не желание».`},
    {title:"Энергетика и механика",body:`Связка: Энергетика + Механика → условия → LVP → QCD.\n\nЭнергетика (5 опор):\nReliability → Efficiency (кВт/т) → Control (учёт по участкам) → Process & Standards (SOP) → Development (Solar)\n«Экономия через режим, не ограничение»\n\nМеханика (5 опор):\nReliability → Maintenance & Standards (ППР) → Spare Parts (ЗИП) → Control (коды простоев) → Improvement\n«Плановый ремонт дешевле аварийного»\n«Не чинить — устранять причину»`},
    {title:"AI в производстве",body:`Level 1 (пассивный): передаём данные → AI анализирует → рекомендации.\n• Сменный отчёт: план/факт, простои, параметры\n• Качество: факт vs ТУ, тренды\n• Энергетика: кВт/т, потери\n• Механика: паттерны поломок, идеи по ППР\n\nLevel 2 (агенты): AI читает данные сам → сигналит → отчёт.\n• Data Agent, LVP Control Agent, Quality Agent\n• Maintenance Agent, Energy Agent, Summary Agent\n\nПравило: «Без данных AI превращается в мнение».\nЧеловек обязателен: Focus, ключевые решения, финальное одобрение.`}

  {id:"sales",title:"Sales & Marketing",icon:"↗",color:"#163a6b",modules:[

    {title:"Навигационные карты продаж",body:`MP по регионам:\n• Хорезм + Каракалпакия: ВСЕ продукты — высокий приоритет\n• Ташкент: OqLa, CeLa, K0, K1, Б0/1, Б2-100 — высокий. Б2-120 — средний\n• Экспорт (ближние): OqLa, CeLa — высокий. K0, K1 — средний. Б2-120 — нет\n• SnP: только OqLa (высокий) + CeLa, K0 (средний)\n\nKW по регионам:\n• Хорезм: все продукты высокий приоритет\n• Ташкент: non-RSC, wRSC — высокий. RSC — средний. SnP, SnP-Lam — высокий\n• Экспорт: non-RSC, wRSC — средний. SnP, SnP-Lam — высокий. RSC — нет\n\nФлаг: RSC или B2-120 в Ташкент → потеря маржи → немедленный анализ.`}

  {id:"people",title:"HR, Safety & COSS",icon:"◉",color:"#7a2a6b",modules:[

    {title:"Safety — Zero Vision",body:`Zero Vision: любой инцидент можно и нужно предотвратить.\n\n5 опор:\n1. Risk Identification: Near Miss в ERP анонимно. Реестр рисков. Выявлять, не скрывать.\n2. Prevention: LOTO (защита энергии), Poka-Yoke, Permit to Work через ERP.\n3. Behavior & Culture: наблюдение, обратная связь. «Не скрывать — сообщать».\n4. Compliance + Practical Safety: обучение на своём оборудовании. Аварийные тренировки.\n5. Visual Management: знаки, зонирование, AI-постеры, микро-обучение.\n\nПравильные KPI: не «ноль травм», а: Near Miss зафиксировано, % закрытых рисков ≥ 90%.`},
    {title:"COSS — Company OS",body:`«Компания управляется системой, а не вручную».\n\n6 опор:\n1. Strategy & BSC: стратегия оцифрована в цели и KPI\n2. Process Design: процессы понятны, без хаоса\n3. ERP: ВСЕ операции через ERP. Нет обходов.\n4. BI & Data: единая правда в цифрах\n5. Execution Discipline: процессы соблюдаются реально\n6. Automation & AI: быстрее, умнее, меньше ручного труда\n\nЦепочка: Стратегия → Процессы → Исполнение → Данные → Дисциплина → Ускорение\n\n«COSS думает, AI проверяет».`},

  {id:"finance",title:"Finance & Supply",icon:"◇",color:"#6b1a1a",modules:[

function LearnView(){
  const [mod,setMod]=useState("core");
  const [lesson,setLesson]=useState(0);
  const m=LEARN.find(x=>x.id===mod);
  useEffect(()=>setLesson(0),[mod]);
  return e("div",{style:{display:"flex",minHeight:"calc(100vh - 44px)"}},
    e("div",{style:{width:155,flexShrink:0,borderRight:"1px solid #e2ddd2",padding:"10px 6px",background:"#f9f7f2",overflowY:"auto"}},
      e("div",{style:{fontSize:10,fontWeight:500,color:"#7a766d",padding:"0 6px",marginBottom:8,letterSpacing:"0.06em"}},"МОДУЛИ"),
      LEARN.map(x=>e("button",{key:x.id,onClick:()=>setMod(x.id),style:{
        display:"flex",alignItems:"center",gap:6,width:"100%",padding:"7px 8px",
        borderRadius:7,border:"none",cursor:"pointer",textAlign:"left",
        background:mod===x.id?x.color+"15":"transparent",
        color:mod===x.id?x.color:"#3d3a33",fontWeight:mod===x.id?500:400,
        fontSize:11,marginBottom:2,transition:"all 0.15s"
      }},e("span",{style:{fontSize:13,flexShrink:0}},x.icon),x.title))
    ),
    e("div",{style:{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}},
      e("div",{style:{padding:"10px 16px",borderBottom:"1px solid #e2ddd2",background:"white",display:"flex",alignItems:"center",gap:8}},
        e("span",{style:{fontSize:18}},m.icon),
        e("div",null,
          e("div",{style:{fontFamily:"'Playfair Display',serif",fontSize:16,color:m.color}},m.title),
          e("div",{style:{fontSize:11,color:"#7a766d"}},m.modules.length+" уроков")
        )
      ),
      e("div",{style:{display:"flex",flex:1,overflow:"hidden"}},
        e("div",{style:{width:185,flexShrink:0,borderRight:"1px solid #e2ddd2",padding:"8px",background:"#f0ede4",overflowY:"auto"}},
          m.modules.map((l,i)=>e("button",{key:i,onClick:()=>setLesson(i),style:{
            display:"block",width:"100%",padding:"9px 10px",borderRadius:7,border:"none",
            cursor:"pointer",textAlign:"left",fontSize:11,fontWeight:500,marginBottom:3,
            background:lesson===i?m.color:"white",color:lesson===i?"white":"#3d3a33",
            boxShadow:lesson===i?"0 2px 6px "+m.color+"44":"none",
            transition:"all 0.2s",lineHeight:1.4
          }},e("div",{style:{fontSize:9,opacity:0.7,marginBottom:1}},`Урок ${i+1}`),l.title))
        ),
        e("div",{style:{flex:1,padding:"22px 26px",overflowY:"auto",background:"white"}},
          e("div",{style:{maxWidth:600}},
            e("div",{style:{fontSize:10,fontWeight:500,color:m.color,marginBottom:8,letterSpacing:"0.08em"}},[m.title.toUpperCase()," · УРОК ",lesson+1]),
            e("h2",{style:{fontFamily:"'Playfair Display',serif",fontSize:21,color:"#14120e",marginBottom:16,lineHeight:1.35}},m.modules[lesson].title),
            e("div",{style:{fontSize:13,color:"#3d3a33",lineHeight:1.85,whiteSpace:"pre-line",
              borderLeft:`3px solid ${m.color}`,paddingLeft:14,
              background:"#f9f7f2",borderRadius:"0 8px 8px 0",padding:"12px 14px"
            }},m.modules[lesson].body),
            e("div",{style:{display:"flex",justifyContent:"space-between",marginTop:20,gap:8}},
              lesson>0?e("button",{onClick:()=>setLesson(lesson-1),style:{
                padding:"7px 14px",borderRadius:7,border:"1px solid #e2ddd2",
                background:"#f0ede4",cursor:"pointer",fontSize:12,color:"#3d3a33"
              }},"← Назад"):e("div"),
              lesson<m.modules.length-1&&e("button",{onClick:()=>setLesson(lesson+1),style:{
                padding:"7px 14px",borderRadius:7,border:"none",
                background:m.color,color:"white",cursor:"pointer",fontSize:12,fontWeight:500
              }},"Следующий урок →")
            ),
            e("div",{style:{display:"flex",gap:5,marginTop:14,justifyContent:"center"}},
              m.modules.map((_,i)=>e("div",{key:i,onClick:()=>setLesson(i),style:{
                width:i===lesson?16:5,height:5,borderRadius:99,cursor:"pointer",
                background:i===lesson?m.color:"#e2ddd2",transition:"all 0.3s"
              }}))
            )
          )
        )
      )
    )
  );
}

function RoadView(){
  const [open,setOpen]=useState(0);
  return e("div",{style:{padding:"18px 16px",maxWidth:900,margin:"0 auto"}},
    e("div",{style:{marginBottom:22}},
      e("div",{style:{fontFamily:"'Playfair Display',serif",fontSize:26,color:"#14120e",marginBottom:4}},"Strategic Roadmap"),
      e("div",{style:{fontSize:13,color:"#7a766d"}},"4 фазы · 24 месяца · путь к автономной компании")
    ),
    ROADMAP.map((ph,pi)=>
      e("div",{key:pi,style:{marginBottom:14}},
        e("div",{onClick:()=>setOpen(open===pi?null:pi),style:{
          display:"flex",alignItems:"center",gap:12,padding:"13px 16px",
          background:open===pi?ph.color:"white",color:open===pi?"white":"#14120e",
          borderRadius:open===pi?"10px 10px 0 0":"10px",border:`1px solid ${ph.color}44`,
          cursor:"pointer",transition:"all 0.2s",userSelect:"none",
          borderBottom:open===pi?"none":undefined
        }},
          e("div",{style:{width:32,height:32,borderRadius:"50%",
            background:open===pi?"rgba(255,255,255,0.2)":ph.bg,
            border:`2px solid ${open===pi?"rgba(255,255,255,0.4)":ph.color}`,
            display:"flex",alignItems:"center",justifyContent:"center",
            fontFamily:"'Playfair Display',serif",fontWeight:600,fontSize:13,
            color:open===pi?"white":ph.color,flexShrink:0}},pi+1),
          e("div",{style:{flex:1}},
            e("div",{style:{fontFamily:"'Playfair Display',serif",fontSize:16,lineHeight:1.2}},ph.phase),
            e("div",{style:{fontSize:11,opacity:0.75,marginTop:2}},ph.period+" · "+ph.tagline)
          ),
          e("span",{style:{fontSize:11,fontWeight:500,padding:"3px 10px",borderRadius:99,
            background:open===pi?"rgba(255,255,255,0.2)":ph.color+"18",
            color:open===pi?"white":ph.color}},ph.goals.length+" целей")
        ),
        open===pi&&e("div",{style:{border:`1px solid ${ph.color}33`,borderTop:"none",borderRadius:"0 0 10px 10px",overflow:"hidden"}},
          ph.goals.map((item,gi)=>
            e("div",{key:gi,style:{padding:"13px 16px",background:gi%2===0?"#faf9f5":"white",
              borderBottom:gi<ph.goals.length-1?"1px solid #f0ede4":"none"}},
              e("div",{style:{display:"flex",alignItems:"flex-start",gap:10}},
                e("div",{style:{width:20,height:20,borderRadius:5,background:ph.bg,
                  border:`1px solid ${ph.color}44`,display:"flex",alignItems:"center",justifyContent:"center",
                  flexShrink:0,marginTop:1}},e("div",{style:{width:6,height:6,borderRadius:"50%",background:ph.color}})),
                e("div",{style:{flex:1}},

                  e("div",{style:{display:"flex",gap:4,flexWrap:"wrap",marginBottom:6}},
                    item.dept.map(did=>{
                      const d=DEPTS.find(x=>x.id===did);
                      return e("span",{key:did,style:{fontSize:10,padding:"2px 7px",borderRadius:99,
                        background:d.bg,color:d.color,border:`1px solid ${d.color}44`}},d.name);
                    })
                  ),
                  e("div",{style:{fontSize:12,color:"#3d3a33",lineHeight:1.65,background:ph.bg,
                    borderRadius:7,padding:"8px 10px"}},
                    e("span",{style:{fontSize:10,fontWeight:500,color:ph.color,display:"block",marginBottom:2,letterSpacing:"0.04em"}},"НА ПРАКТИКЕ"),
                    item.d

                )
              )
            )

    e("div",{style:{marginTop:22,padding:"16px 18px",background:"#14120e",borderRadius:12}},

    tab==="road"&&e(RoadView)

}
